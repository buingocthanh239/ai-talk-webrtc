<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Learn — Luyện nói tiếng Anh</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>"
    />
  </head>
  <body>
    <audio id="ai-audio" autoplay></audio>

    <!-- ────────────────────────────── HOME ────────────────────────────── -->
    <main id="screen-home" class="screen">
      <header class="hero">
        <h1>AI Learn</h1>
        <p>Luyện nói tiếng Anh với AI qua WebRTC — thời gian thực, có chấm điểm và ghi âm lại.</p>
      </header>

      <div id="quota-notice" class="banner hidden"></div>

      <section>
        <h2>Chọn bài học</h2>
        <div id="lesson-list" class="card-grid"></div>
      </section>

      <section>
        <h2>Buổi học đã lưu</h2>
        <div id="history-list" class="history"></div>
      </section>
    </main>

    <!-- ────────────────────────────── LIVE ────────────────────────────── -->
    <main id="screen-live" class="screen hidden">
      <div id="status-banner" class="banner hidden"></div>

      <div class="live-layout">
        <aside class="panel">
          <button id="btn-quit" class="link-btn">← Thoát</button>
          <h2 id="live-title"></h2>
          <div id="live-meta" class="meta"></div>

          <h3>Mục tiêu bài học</h3>
          <ul id="objective-list" class="objectives"></ul>

          <h3>Từ vựng cần dùng</h3>
          <ul id="vocab-list" class="vocab"></ul>

          <h3>Ngữ pháp trọng tâm</h3>
          <ul id="grammar-list" class="grammar"></ul>
        </aside>

        <section class="stage">
          <div id="transcript" class="transcript"></div>

          <div class="dock">
            <div id="hint-chips" class="hints"></div>

            <div class="compose">
              <input
                id="text-input"
                type="text"
                placeholder="Hoặc gõ câu trả lời rồi Enter…"
                autocomplete="off"
                disabled
              />
              <button id="btn-send" class="ghost-btn" disabled>Gửi</button>
            </div>

            <button id="btn-ptt" class="ptt-btn" data-state="locked" disabled>
              <span class="ptt-icon">🎙</span>
              <span class="ptt-text">Giữ để nói</span>
            </button>
            <p class="ptt-tip">Giữ chuột, chạm giữ, hoặc giữ phím <kbd>Space</kbd></p>

            <div class="controls">
              <div id="mic-state" class="mic-state">
                <span class="dot"></span><span id="mic-label">Đang kết nối…</span>
              </div>
              <span id="quota-clock" class="quota-clock hidden"></span>
              <button id="btn-hint" class="ghost-btn">💡 Gợi ý</button>
              <button id="btn-finish" class="primary-btn" disabled>Kết thúc bài học</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- ───────────────────────────── SUMMARY ──────────────────────────── -->
    <main id="screen-summary" class="screen hidden">
      <button id="btn-home" class="link-btn">← Về trang chủ</button>
      <div id="summary-body"></div>
    </main>

    <script type="module" src="/js/bundle.js"></script>
  </body>
</html>
